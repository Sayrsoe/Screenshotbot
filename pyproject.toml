[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sayrsoe-screenshotbot"
version = "0.1.0"
description = "Manual capture of two local synthetic football statistics fixtures"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["playwright==1.65.1"]

[tool.setuptools.packages.find]
where = ["src"]
